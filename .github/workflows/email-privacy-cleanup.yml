name: One-time author privacy cleanup
on:
  push:
    paths:
      - .github/workflows/email-privacy-cleanup.yml
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite author metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/email-privacy-cleanup.yml
          git commit -m "Remove one-time maintenance workflow"
          pip install --quiet git-filter-repo
          git filter-repo --force --email-callback 'return b"noreply@users.noreply.github.com" if email.lower() == b"sirasterthecat@gmail.com" else email'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/main
